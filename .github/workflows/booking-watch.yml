name: booking-watch

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram test message"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: booking-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Telegram test message
        if: ${{ inputs.test_telegram == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          if not token:
              raise RuntimeError("TELEGRAM_BOT_TOKEN secret is empty")

          if not chat_id:
              raise RuntimeError("TELEGRAM_CHAT_ID secret is empty")

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": "✅ Movie-Alert test successful!\n\nGitHub Actions can send Telegram messages.",
                  "disable_web_page_preview": True,
              },
              timeout=30,
          )

          print("Telegram HTTP status:", response.status_code)

          if not response.ok:
              print("Telegram response:", response.text)

          response.raise_for_status()
          print("Test message sent successfully.")
          PY

      - name: Run poller
        if: ${{ inputs.test_telegram != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python poller.py

      - name: Persist state
        if: ${{ inputs.test_telegram != true }}
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "booking-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update booking-watch state [skip ci]"
            git push
          else
            echo "No state change."
          fi
